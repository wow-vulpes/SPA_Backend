server:
  port: ${APP_PORT:8080}
spring:
  application.name: spa-backend
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spa}
    username: ${DB_USER:spa}
    password: ${DB_PASSWORD:spa}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
app:
  demo.enabled: ${APP_DEMO_ENABLED:false}
  time-zone: ${APP_TIME_ZONE:Europe/Moscow}
  alerts:
    lead-time-days: ${APP_ALERTS_LEAD_TIME_DAYS:${APP_ALERTS_SHORTAGE_DAYS:30}}
    expiry-days: ${APP_ALERTS_EXPIRY_DAYS:30}
    inactivity-days: ${APP_ALERTS_INACTIVITY_DAYS:90}
