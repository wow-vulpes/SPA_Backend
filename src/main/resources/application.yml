server:
  port: ${APP_PORT:8080}
spring:
  application.name: spa-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spa}
    username: ${DB_USER:spa}
    password: ${DB_PASSWORD:spa}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never
app:
  time-zone: ${APP_TIME_ZONE:Europe/Moscow}
